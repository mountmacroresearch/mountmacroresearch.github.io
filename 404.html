<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>没有找到页面 · Mount Macro Research</title>
<meta name="robots" content="noindex">
<style>
html, body { height: 100%; margin: 0; background: #050505; color: #f1eadb; font: 400 15px/1.8 "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif; -webkit-font-smoothing: antialiased }
main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center; box-sizing: border-box }
b { font: 600 15px/1 "Avenir Next", "Helvetica Neue", system-ui, sans-serif; letter-spacing: .24em; color: #e0c48c }
h1 { margin: 0; font-weight: 300; font-size: 30px; letter-spacing: .2em }
a { color: inherit; text-decoration: none; letter-spacing: .08em; border-bottom: 1px solid rgba(207, 176, 122, .55); padding-bottom: 2px }
a:hover { border-bottom-color: #cfb07a }
</style>
</head>
<body>
<main>
  <b>MMR</b>
  <h1>没有找到这个页面</h1>
  <a id="home" href="./">回到总览</a>
</main>
<script>
// 这个页面可能出现在任意层级的地址上：先找到网站的根，再把链接指过去
(function () {
  const seg = location.pathname.split('/').filter(Boolean)[0];
  const roots = ['/'].concat(seg ? ['/' + seg + '/'] : []);
  const link = document.getElementById('home');
  (function next(i) {
    if (i >= roots.length) return;
    fetch(roots[i] + 'assets/site.js', { method: 'HEAD' }).then(r => { if (r.ok) link.href = roots[i]; else next(i + 1); }).catch(() => next(i + 1));
  })(0);
})();
</script>
</body>
</html>
